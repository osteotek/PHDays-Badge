; Copy to wifi_secrets.ini (gitignored) and fill in your 2.4 GHz WPA2 network.
; The badge joins it automatically after flashing.
[wifi]
ssid = YourNetwork
password = your-wifi-password

; Token for Wi-Fi firmware updates (pio run -e badge-ota -t upload). Use 16-100
; letters, digits, '-' or '_', e.g. from: python3 -c "import secrets; print(secrets.token_urlsafe(24))"
; Empty disables Wi-Fi updates.
[ota]
token =
