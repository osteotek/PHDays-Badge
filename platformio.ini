; PlatformIO build for the PHDays badge (ESP-IDF framework).
; espressif32 7.1.3 bundles ESP-IDF 6.1.0.

[platformio]
src_dir = main
default_envs = badge

[env:badge]
platform = espressif32@7.1.3
framework = espidf
board = esp32dev

; Configuration lives in sdkconfig.defaults; the build generates sdkconfig from
; it (gitignored). scripts/sdkconfig_path.py makes the path absolute so the
; bootloader build uses the same configuration.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 4096000

; Must match EMBED_FILES in main/CMakeLists.txt.
board_build.embed_files =
    main/ui/wifi.html
    main/ui/1.js.gz
    main/ui/apple-touch-icon.png
    main/ui/epilepsy-sans.eot.gz
    main/ui/epilepsy-sans.svg.gz
    main/ui/epilepsy-sans.ttf.gz
    main/ui/epilepsy-sans.woff
    main/ui/epilepsy-sans.woff2
    main/ui/favicon.ico
    main/ui/index.html
    main/ui/main.css.gz
    main/ui/main.js.gz
    main/ui/webfont-icons.svg.gz

; The badge's CH340 adapter drops bytes above 115200 baud on macOS.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload writes the bootloader (0x1000), partition table (0x8000), a blank
; otadata (0x19000, so the badge boots ota_0) and the app (ota_0, 0x20000).
; NVS and storage are never written.
extra_scripts =
    pre:scripts/sdkconfig_path.py
    pre:scripts/python_deps.py
    pre:scripts/wifi_secrets.py

; Wi-Fi update of the app only (bootloader and partition table need USB):
;   pio run -e badge-ota -t upload [--upload-port <badge IP>]
; Authenticates with [ota] token from wifi_secrets.ini.
[env:badge-ota]
extends = env:badge
upload_protocol = custom
upload_port = 192.168.1.45
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/ota_upload.py" "$SOURCE" $UPLOAD_PORT
